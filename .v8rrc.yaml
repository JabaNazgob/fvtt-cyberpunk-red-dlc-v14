      fileMatch: ["src/packs/**/**/scene.*.yaml"]
      location: ".cicd/schema/scene.json"
    - name: "Skills"
      description: "Schema for validating Skill YAML fragments"
      fileMatch: ["src/packs/**/**/skill.*.yaml"]
      location: ".cicd/schema/skill.json"
    - name: "Tables"
      description: "Schema for validating Table YAML fragments"
