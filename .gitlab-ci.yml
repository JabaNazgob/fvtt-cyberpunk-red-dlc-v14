include:
  - project: "cyberpunk-red-team/cprc-cicd"
    ref: dev
    file:
      # Shared config: default image, stages, and the `.cprc-rules` ruleset.
      - "/jobs/init/config.yml"
      # Release (run on tags): build + create the GitLab Release, validate the
      # uploaded assets, then publish the latest manifest Foundry polls.
      - "/jobs/release/build-artifacts.yml"
      - "/jobs/release/create-release.yml"
      - "/jobs/release/pre-release.yml"
      - "/jobs/release/publish.yml"
      # Manage: issue automation (uses the group-level CHOOM_BOT_API token).
      - "/jobs/manage/manage-issues-on-mr.yml"
      - "/jobs/manage/manage-issues-on-merge.yml"
      - "/jobs/manage/manage-issues-on-release.yml"

  # Init carries the token-validation input the manage-issues jobs rely on.
  - project: "cyberpunk-red-team/cprc-cicd"
    ref: dev
    file: "/jobs/init/init.yml"
    inputs:
      gitlab_tokens_to_test: "CHOOM_BOT_API"

  # Scope prettier to the source we format (en babele included; translations
  # and other generated/vendored files excluded).
  - project: "cyberpunk-red-team/cprc-cicd"
    ref: dev
    file: "/jobs/test/code-formatting.yml"
    inputs:
      paths: "gulpfile.mjs gulp/*.mjs src/*.js src/**/*.yaml src/*.json src/**/*.json src/babele/en/*.json"

  # Validate packs against the cyberpunk-red-core schema, at the system version
  # declared in src/module.json (relationships.systems compatibility.maximum).
  - project: "cyberpunk-red-team/cprc-cicd"
    ref: dev
    file: "/jobs/test/packs.yml"
    inputs:
      system_repo: "cyberpunk-red-team/fvtt-cyberpunk-red-core"
      # TEMPORARY: validate against system `dev`, which now carries the
      # complete-document schema (merged via core!1537). Remove this override
      # once the next system release ships, after which packs validate against
      # the manifest-declared version (src/module.json compatibility.maximum).
      system_ref: "dev"

  # Block manual edits to the vendored cprc-build gulp subtree.
  - project: "cyberpunk-red-team/cprc-cicd"
    ref: dev
    file: "/jobs/test/subtree-guard.yml"
    inputs:
      component_repo: "cyberpunk-red-team/cprc-build"

  # Keep the vendored build-system subtree updated from the public cprc-build repo.
  - project: "cyberpunk-red-team/cprc-cicd"
    ref: dev
    file: "/jobs/manage/build-system-sync.yml"

variables:
  BUILD_SYNC_SOURCE_PROJECT: "cyberpunk-red-team/cprc-build"
  BUILD_SYNC_SOURCE_BRANCH: "main"
  BUILD_SYNC_PREFIX: "gulp"
  BUILD_SYNC_TARGET_BRANCH: "dev"
  BUILD_SYNC_REBASE_TOKEN: "$CHOOM_BOT_API"
